name: On Push Branch
run-name: On Push Branch

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
jobs:
  print-context:
    runs-on: ubuntu-latest
    steps:
      - name: echo github context
        run: echo '${{ toJSON(github) }}'

      - name: echo env context
        run: echo '${{ toJSON(env) }}'

  quality-tests:
    needs: print-github-context
    uses: ./.github/workflows/callable-ruff-mypy.yml

  buildable-check:
    needs: quality-tests
    uses: ./.github/workflows/callable-build-check.yml
  
  matrix-tests:
    needs: buildable-check
    strategy:
      matrix:
        python-version: [ '3.12', '3.13' ]
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]
    uses: ./.github/workflows/callable-pytest.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

  create-release:
    needs: matrix-tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    uses: ./.github/workflows/callable-build-and-artifact.yml

  publish-release:
    needs: create-release
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    uses: ./.github/workflows/callable-push-to-pypi.yml
